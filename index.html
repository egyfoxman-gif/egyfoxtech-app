    <script>
      // Compatibility guard for browser extensions (e.g. frame_ant) that assign window.fetch = ...
      (function() {
        try {
          var origFetch = window.fetch;
          var activeFetch = origFetch ? function() { return origFetch.apply(window, arguments); } : undefined;

          var makeFetchWritable = function(target) {
            if (!target) return;
            try {
              Object.defineProperty(target, 'fetch', {
                get: function() {
                  return activeFetch || (origFetch ? function() { return origFetch.apply(window, arguments); } : undefined);
                },
                set: function(val) {
                  activeFetch = val;
                },
                configurable: true,
                enumerable: true
              });
            } catch (err) {}
          };

          if (typeof Window !== 'undefined' && Window.prototype) {
            makeFetchWritable(Window.prototype);
          }
          makeFetchWritable(window);
        } catch (e) {}

        // Suppress external extension injection errors
        window.addEventListener('error', function(event) {
          if (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
